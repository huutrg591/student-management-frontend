<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - KTX PTIT</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-color); }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: var(--primary-color); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ĐĂNG NHẬP</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Tên đăng nhập (VD: admin)" required>
            <input type="password" id="password" placeholder="Mật khẩu" required>
            <button type="submit">Vào Hệ Thống</button>
        </form>
        <p style="margin-top: 15px;"><a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Quay lại trang chủ</a></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.toLowerCase();
            
            // Xử lý chuyển hướng tạm thời ở FE (Nếu có BE thì thay bằng Fetch API)
            if (username === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'pages/student-dashboard.html';
            }
        });
    </script>
</body>
</html>
