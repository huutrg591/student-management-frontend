<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Hệ Thống KTX</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; }
        .login-box { background: white; padding: 40px; border-radius: 10px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-box h2 { color: #3498db; text-align: center; border: none; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>KÝ TÚC XÁ ADMIN</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Tài khoản (Tên đăng nhập / MSV):</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" id="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng Nhập</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if(response.ok) return response.json();
                throw new Error("Sai tài khoản/mật khẩu");
            })
            .then(data => {
                localStorage.setItem('user', JSON.stringify(data));
                
                if(data.role === 'ADMIN') {
                    window.location.href = 'index.html';
                } else if(data.role === 'STUDENT') {
                    window.location.href = 'pages/student-dashboard.html';
                }
            })
            .catch(error => alert(error.message));
        });
    </script>
</body>
</html>
